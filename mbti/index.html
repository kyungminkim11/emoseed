<head>

  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="나와 닮은 식물 찾기 | EmoSeed">
  <meta property="og:description" content="8개의 질문으로 나의 성향과 닮은 식물, 강점과 오늘의 감정 관리 팁을 확인해보세요.">

  <meta name="twitter:description" content="8개의 질문으로 나의 성향과 닮은 식물, 강점과 오늘의 감정 관리 팁을 확인해보세요.">

</head>
<body data-base="../" data-page="type">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
<section class="page-hero">
  <span class="eyebrow">🌱 EmoSeed Type</span>
  <h1>나는 어떤 식물과<br>닮아 있을까요?</h1>
  <p>8개의 질문에 마음 가는 대로 답해주세요. 유형을 단정하기보다 지금의 나를 이해하는 작은 힌트를 드릴게요.</p>
</section>

<section class="test-shell" id="introCard">
  <div class="content-card" style="text-align:center">
    <div style="font-size:54px" aria-hidden="true">🪴</div>
    <h2>준비되셨나요?</h2>
    <p style="color:var(--muted)">약 1분이 걸려요. 정답은 없으니 오래 고민하지 않아도 괜찮습니다.</p>
    <div class="button-row" style="justify-content:center"><button class="primary-button" id="startTest" type="button">테스트 시작하기</button></div>
  </div>
</section>

<section class="test-shell" id="testArea" hidden aria-live="polite">
  <div class="progress-wrap">
    <div class="progress-meta"><span id="progressText">1 / 8</span><span id="progressPercent">13%</span></div>
    <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1" aria-label="테스트 진행률"><div class="progress-bar" id="progressBar" style="width:12.5%"></div></div>
  </div>
  <div class="question-card reveal" id="questionCard">
    <h2 id="questionText"></h2>
    <div class="choice-list" id="choiceList"></div>
  </div>
  <div class="test-actions">
    <button class="secondary-button" id="prevQuestion" type="button">← 이전</button>
    <button class="primary-button" id="nextQuestion" type="button" disabled>다음 →</button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const questions = window.EMOSEED_DATA.questions;
    const intro = document.getElementById('introCard');
    const area = document.getElementById('testArea');
    const card = document.getElementById('questionCard');
    const text = document.getElementById('questionText');
    const list = document.getElementById('choiceList');
    const prev = document.getElementById('prevQuestion');
    const next = document.getElementById('nextQuestion');
    const bar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressTrack = document.querySelector('[role="progressbar"]');
    let index = 0;
    const answers = Array(questions.length).fill(null);
    let autoTimer;

    function render() {
      clearTimeout(autoTimer);
      const question = questions[index];
      const percent = Math.round(((index + 1) / questions.length) * 100);
      progressText.textContent = `${index + 1} / ${questions.length}`;
      progressPercent.textContent = `${percent}%`;
      bar.style.width = `${percent}%`;
      progressTrack.setAttribute('aria-valuenow', index + 1);
      text.textContent = question.text;
      list.innerHTML = question.choices.map(([label, value], choiceIndex) => `
        <button class="choice-button${answers[index] === value ? ' selected' : ''}" type="button" data-value="${value}" aria-pressed="${answers[index] === value}">
          <span class="choice-index">${choiceIndex + 1}</span><span>${label}</span>
        </button>`).join('');
      prev.disabled = index === 0;
      next.disabled = !answers[index];
      next.textContent = index === questions.length - 1 ? '결과 보기 →' : '다음 →';
      card.classList.remove('reveal'); void card.offsetWidth; card.classList.add('reveal');
      list.querySelectorAll('.choice-button').forEach((button) => {
        button.addEventListener('click', () => {
          answers[index] = button.dataset.value;
          list.querySelectorAll('.choice-button').forEach((item) => {
            const active = item === button;
            item.classList.toggle('selected', active);
            item.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          next.disabled = false;
          autoTimer = setTimeout(() => advance(), 380);
        });
      });
    }

    function finish() {
      const score = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
      answers.forEach((value) => { score[value[0]] += Number(value[1]); });
      const result = (score.E >= score.I ? 'E' : 'I') + (score.S >= score.N ? 'S' : 'N') + (score.T >= score.F ? 'T' : 'F') + (score.J >= score.P ? 'J' : 'P');
      window.EmoSeedApp.track('test_complete', { test: 'type', result });
      location.href = `result.html?type=${result}`;
    }

    function advance() {
      if (!answers[index]) return;
      if (index === questions.length - 1) return finish();
      index += 1;
      render();
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.getElementById('startTest').addEventListener('click', () => {
      intro.hidden = true;
      area.hidden = false;
      render();
      window.EmoSeedApp.track('test_start', { test: 'type' });
      area.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    prev.addEventListener('click', () => { if (index > 0) { index -= 1; render(); } });
    next.addEventListener('click', advance);
  });
</script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
