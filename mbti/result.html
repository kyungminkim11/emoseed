<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmoSeed Type 결과</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem;font-size:.95rem;line-height:1.6}.theme-link{cursor:pointer;font-weight:500;color:inherit;margin:0 .2rem}
</style></head><body><div class="wrapper"><main class="content">
<nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="index.html" class="active">🌱 EmoSeed Type</a><a href="../compatibility/index.html">💘 EmoSeed Match</a><a href="../name-generator/index.html">🌼 EmoSeed Name</a><a href="../fortune/index.html">🔮 EmoSeed Fortune</a></div></nav>
<section class="header-message" id="capture-area" style="padding:2rem 1rem"><h1>🌱 당신의 식물 MBTI 결과는?</h1><img id="plant-image" alt="식물 이미지" style="width:100%;max-width:400px;height:auto;border-radius:12px;margin:2rem auto 1.5rem"><p id="mbti-type" style="font-size:1.2rem;font-weight:bold"></p><p id="plant-name" style="font-size:1.5rem;color:#4a774a"></p><p id="plant-message" style="color:#555"></p></section>
<div style="text-align:center;margin-top:2rem"><button onclick="saveFullResult()">📋 MBTI 결과 저장하기</button><button onclick="copyURL()">🔗 링크 복사하기</button><button onclick="shareEmail()">📧 이메일로 보내기</button><button onclick="location.href='index.html'">↩️ 다시 테스트하기</button></div>
<hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('compatibility')">🌿 EmoSeed Match</button><button onclick="goTo('name-generator')">🌿 EmoSeed Name</button><button onclick="goTo('fortune')">🌿 EmoSeed Fortune</button></div><div class="theme-status" id="themeStatus"></div><div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const data={INFP:['무궁화','조용하고 깊은 이상주의자. 무궁화처럼 고요한 힘을 지닌 당신이에요.'],INFJ:['라벤더','섬세하고 따뜻한 조언자. 라벤더처럼 주변을 치유하는 힘이 있어요.'],INTP:['민트','호기심 많은 분석가. 민트처럼 시원한 관찰력을 가진 당신!'],INTJ:['스투키','논리적이고 단단한 전략가. 스투키처럼 흔들림 없는 지성인입니다.'],ISFP:['수국','감성적이고 부드러운 예술가. 수국처럼 다채로운 감정의 색을 지녔어요.'],ISTP:['선인장','실용적이고 독립적인 해결사. 선인장처럼 강인한 내면의 힘이 있습니다.'],ISFJ:['알로에','헌신적이고 조용한 보호자. 알로에처럼 상처를 감싸는 성품이에요.'],ISTJ:['대나무','책임감 강한 현실주의자. 대나무처럼 곧고 믿음직한 당신입니다.'],ENFP:['해바라기','열정 넘치고 자유로운 영혼. 해바라기처럼 언제나 밝고 긍정적이에요.'],ENFJ:['장미','사람을 이끄는 따뜻한 리더. 장미처럼 매력과 카리스마가 가득해요.'],ENTP:['페퍼민트','재치 있고 창의적인 발명가. 페퍼민트처럼 톡 쏘는 아이디어의 소유자!'],ENTJ:['튤립','대담한 통솔자. 튤립처럼 당당하고 목표 지향적인 에너지를 지녔어요.'],ESFP:['코스모스','즐겁고 에너지 넘치는 낙천주의자. 코스모스처럼 자연스럽고 따뜻해요.'],ESTP:['장미허브','모험적인 활동가. 장미허브처럼 활력 있고 감각적인 사람이에요.'],ESFJ:['카네이션','다정하고 사교적인 보호자. 카네이션처럼 따뜻한 배려심이 가득해요.'],ESTJ:['유칼립투스','현실적이고 이성적인 리더. 유칼립투스처럼 시원하고 단단한 성향입니다.']};
const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'},type=new URLSearchParams(location.search).get('type');if(data[type]){document.getElementById('mbti-type').textContent=`유형: ${type}`;document.getElementById('plant-name').textContent=`식물: ${data[type][0]}`;document.getElementById('plant-message').textContent=data[type][1];document.getElementById('plant-image').src=`../assets/images/${type.toLowerCase()}.svg`}else document.getElementById('mbti-type').textContent='결과를 불러올 수 없습니다.';
function saveFullResult(){html2canvas(document.getElementById('capture-area')).then(c=>{const a=document.createElement('a');a.download=`EmoSeed_${type}.png`;a.href=c.toDataURL('image/png');a.click()})}function copyURL(){navigator.clipboard.writeText(location.href).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareEmail(){const p=data[type]||['',''];location.href=`mailto:?subject=${encodeURIComponent('🌿 당신의 식물 MBTI는 '+type)}&body=${encodeURIComponent(`결과는 [${type} - ${p[0]}] 였어요!\n\n${p[1]}\n\n${location.href}`)}`}function goTo(f){location.href=`../${f}/index.html`}function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)
</script></main></div></body></html>
