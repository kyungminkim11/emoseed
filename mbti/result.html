<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나와 닮은 식물 결과 | EmoSeed</title>
  <meta name="description" content="나와 닮은 식물 유형과 강점, 지쳤을 때의 모습, 오늘의 마음 돌봄 팁을 확인해보세요.">
  <meta name="theme-color" content="#f6fbf6">
  <meta name="robots" content="noindex,follow">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://emoseed.lavalabs.co.kr/mbti/result.html">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EmoSeed">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="나와 닮은 식물 결과 | EmoSeed">
  <meta property="og:description" content="나와 닮은 식물 유형과 강점, 지쳤을 때의 모습, 오늘의 마음 돌봄 팁을 확인해보세요.">
  <meta property="og:url" content="https://emoseed.lavalabs.co.kr/mbti/result.html">
  <meta property="og:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나와 닮은 식물 결과 | EmoSeed">
  <meta name="twitter:description" content="나와 닮은 식물 유형과 강점, 지쳤을 때의 모습, 오늘의 마음 돌봄 팁을 확인해보세요.">
  <meta name="twitter:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <script defer src="../assets/js/data.js"></script>
  <script defer src="../assets/js/app.js"></script>
</head>
<body data-base="../" data-page="type">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
  <section class="page-hero compact">
    <span class="eyebrow">🌱 EmoSeed Type Result</span>
    <h1>당신을 닮은 식물을<br>만났어요</h1>
  </section>
  <section class="result-shell">
    <article class="result-card" id="resultCard">
      <div class="loading-state" id="loading"><div><div class="spinner"></div><p>결과를 피워내고 있어요…</p></div></div>
      <div id="resultContent" hidden>
        <div class="result-header">
          <div>
            <div class="result-kicker" id="resultType"></div>
            <h2 class="result-title" id="resultTitle"></h2>
            <p class="result-subtitle" id="resultTagline"></p>
            <div class="keyword-list" id="keywordList"></div>
          </div>
          <img class="result-image" id="resultImage" alt="">
        </div>
        <div class="detail-grid">
          <section class="detail-card"><h3>✨ 나의 강점</h3><p id="resultStrength"></p></section>
          <section class="detail-card"><h3>🌧️ 지쳤을 때의 모습</h3><p id="resultTired"></p></section>
          <section class="detail-card"><h3>🫧 오늘의 돌봄 방법</h3><p id="resultCare"></p></section>
          <section class="detail-card"><h3>💞 잘 맞는 식물</h3><p id="resultMatch"></p></section>
        </div>
        <div class="quote-card" id="resultQuote"></div>
      </div>
    </article>
    <div class="share-panel">
      <p>결과를 저장하거나 친구에게 나눠보세요.</p>
      <div class="button-row">
        <button class="primary-button" type="button" id="saveResult">📷 이미지 저장</button>
        <button class="secondary-button" type="button" id="shareResult">공유하기</button>
        <button class="secondary-button" type="button" data-copy-link>링크 복사</button>
        <a class="text-button" href="index.html">다시 테스트</a>
      </div>
    </div>
    <section class="section compact">
      <div class="section-heading"><div><h2 style="font-size:28px">다른 정원도 둘러보세요</h2></div></div>
      <div class="related-grid">
        <a class="related-card" href="../fortune/index.html"><strong>🔮 오늘의 운세</strong><span>오늘의 식물이 건네는 한마디</span></a>
        <a class="related-card" href="../name-generator/index.html"><strong>🌼 식물 이름 만들기</strong><span>내 감정으로 만드는 이름</span></a>
        <a class="related-card" href="../compatibility/index.html"><strong>💘 식물 궁합</strong><span>나와 식물의 감성 점수</span></a>
      </div>
    </section>
  </section>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const type = new URLSearchParams(location.search).get('type')?.toUpperCase();
      const valid = window.EMOSEED_DATA.plants.some((plant) => plant.type === type);
      const plant = window.EmoSeed.plantByType(valid ? type : 'INFP');
      const imageSrc = `../assets/images/${plant.type.toLowerCase()}.svg`;
      document.title = `${plant.type} ${plant.name} — 나와 닮은 식물 | EmoSeed`;
      document.getElementById('resultType').textContent = `${plant.type} · EMOSEED TYPE`;
      document.getElementById('resultTitle').textContent = plant.name;
      document.getElementById('resultTagline').textContent = plant.tagline;
      document.getElementById('keywordList').innerHTML = plant.keywords.map((keyword) => `<span class="keyword">${keyword}</span>`).join('');
      document.getElementById('resultStrength').textContent = plant.strength;
      document.getElementById('resultTired').textContent = plant.tired;
      document.getElementById('resultCare').textContent = plant.care;
      document.getElementById('resultMatch').textContent = `${plant.match}처럼 서로의 다른 리듬을 편안하게 채워주는 관계예요.`;
      document.getElementById('resultQuote').textContent = `“${plant.quote}”`;
      const image = document.getElementById('resultImage');
      image.src = imageSrc;
      image.alt = `${plant.name} 일러스트`;
      document.getElementById('loading').hidden = true;
      document.getElementById('resultContent').hidden = false;
      document.getElementById('saveResult').addEventListener('click', () => window.EmoSeedApp.downloadResultImage({
        kicker: `${plant.type} · EMOSEED TYPE`, title: plant.name, subtitle: plant.tagline,
        keywords: plant.keywords, message: plant.strength, quote: plant.quote, imageSrc,
        filename: `EmoSeed_${plant.type}_${plant.name}.png`
      }));
      document.getElementById('shareResult').addEventListener('click', () => window.EmoSeedApp.share({
        title: `${plant.type} ${plant.name} — 나와 닮은 식물`, text: `${plant.tagline}
${plant.quote}`, url: location.href
      }));
      window.EmoSeedApp.track('result_view', { test: 'type', result: plant.type });
    });
  </script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
