name: Fix theme click scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-theme-click.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict theme handlers to theme buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("document.querySelectorAll('[data-theme]')", "document.querySelectorAll('.theme-chip[data-theme]')")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-theme-click.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix theme toast on unrelated clicks'
          git push
