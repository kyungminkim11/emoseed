name: Apply EmoSeed v3 service expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-emoseed-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow

      - name: Build EmoSeed v3
        shell: bash
        run: |
          cat > /tmp/apply_emoseed_v3.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json, re, html

          ROOT = Path('.')
          BASE = 'https://emoseed.lavalabs.co.kr'
          plants = [
            ('INFP','무궁화','조용하지만 쉽게 꺾이지 않는 마음','당신의 속도는 느린 것이 아니라, 깊게 뿌리내리는 중이에요.',['깊은 감정','상상력','진심']),
            ('INFJ','라벤더','곁에 있는 사람의 마음을 조용히 돌보는 사람','누군가를 비추는 빛도 가끔은 스스로를 향해야 해요.',['통찰','배려','치유']),
            ('INTP','민트','새로운 관점으로 세상을 해석하는 탐구자','완벽한 답보다 살아 있는 질문이 당신을 더 멀리 데려가요.',['호기심','분석','독창성']),
            ('INTJ','스투키','긴 호흡으로 목표를 설계하는 단단한 전략가','단단함은 쉬지 않는 것이 아니라, 다시 설 힘을 남겨두는 일이에요.',['계획','독립성','집중']),
            ('ISFP','수국','감정을 색과 분위기로 기억하는 섬세한 예술가','당신의 섬세함은 약함이 아니라 세상을 더 많이 느끼는 힘이에요.',['감각','자유','다정함']),
            ('ISTP','선인장','필요한 순간 정확하게 움직이는 독립적인 해결사','혼자 잘해내는 사람에게도 기대어 쉴 자리는 필요해요.',['실용성','침착함','자율']),
            ('ISFJ','알로에','작은 불편까지 먼저 알아채는 다정한 보호자','다정함은 나를 소진할 때보다 나까지 포함할 때 오래가요.',['성실함','세심함','책임감']),
            ('ISTJ','대나무','약속과 기준을 지키며 신뢰를 쌓는 사람','꾸준함에도 숨을 고르는 마디가 있어야 더 높이 자랄 수 있어요.',['책임감','정확함','꾸준함']),
            ('ENFP','해바라기','가능성을 발견하면 먼저 빛을 향해 움직이는 사람','모든 빛을 따라갈 필요는 없어요. 지금 가장 따뜻한 방향이면 충분해요.',['열정','공감','가능성']),
            ('ENFJ','장미','사람의 가능성을 믿고 함께 피어나게 하는 리더','사랑받기 위해 계속 피어 있을 필요는 없어요. 가시가 있는 날도 당신이에요.',['영향력','공감','표현력']),
            ('ENTP','페퍼민트','익숙한 규칙을 유쾌하게 뒤집는 아이디어 메이커','당신의 번뜩임은 완성이라는 작은 화분에 담길 때 더 오래 살아남아요.',['재치','도전','발상']),
            ('ENTJ','튤립','목표를 선명하게 세우고 길을 만들어가는 사람','더 멀리 가는 힘은 밀어붙임뿐 아니라 방향을 다시 보는 여유에서도 나와요.',['추진력','결단','성장']),
            ('ESFP','코스모스','지금 이 순간의 즐거움을 주변과 나누는 사람','누군가가 보지 않아도 아름다운 순간은 여전히 당신의 것이에요.',['활력','친화력','감각']),
            ('ESTP','장미허브','상황을 빠르게 읽고 바로 움직이는 에너지형 실천가','빠르게 가는 당신에게도 풍경을 기억할 만큼의 속도는 필요해요.',['행동력','순발력','현실감']),
            ('ESFJ','카네이션','관계의 온도를 살피며 편안한 자리를 만드는 사람','당신의 가치는 누군가의 고마움보다 먼저 존재해요.',['친절','조화','헌신']),
            ('ESTJ','유칼립투스','현실적인 기준으로 질서와 성과를 만드는 사람','정돈된 하루는 빈틈이 없는 하루가 아니라, 숨 쉴 공간이 있는 하루예요.',['관리력','명확함','실행력']),
          ]

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def patch(path, old, new):
              text = read(path)
              if old in text and new not in text:
                  write(path, text.replace(old, new, 1))

          def font(size, bold=False):
              choices = [
                '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc' if bold else '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
                '/usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc' if bold else '/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc',
                '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
              ]
              for choice in choices:
                  if Path(choice).exists():
                      return ImageFont.truetype(choice, size)
              return ImageFont.load_default()

          def rr(draw, box, radius, fill):
              draw.rounded_rectangle(box, radius=radius, fill=fill)

          img_dir = ROOT / 'assets/images'
          img_dir.mkdir(parents=True, exist_ok=True)

          def draw_leaf(draw, cx, cy, scale=1.0):
              green = '#2f6f50'
              light = '#bcdcc5'
              draw.ellipse([cx-86*scale, cy-55*scale, cx+5*scale, cy+64*scale], fill=light)
              draw.ellipse([cx-5*scale, cy-75*scale, cx+88*scale, cy+48*scale], fill=green)
              draw.line([cx, cy+82*scale, cx, cy-24*scale], fill='#183c2d', width=max(2,int(10*scale)))

          def make_og(filename, title, subtitle, typ='', tags=()):
              im = Image.new('RGB', (1200, 630), '#f6fbf6')
              d = ImageDraw.Draw(im)
              rr(d, [48, 42, 1152, 588], 42, '#ffffff')
              rr(d, [790, 94, 1082, 406], 38, '#e5f1e8')
              draw_leaf(d, 936, 235, 1.0)
              d.text((92, 84), 'EmoSeed · DIGITAL GARDEN', font=font(27, True), fill='#2f6f50')
              d.text((92, 158), title, font=font(58, True), fill='#183c2d')
              lines = []
              line = ''
              f = font(29)
              for ch in subtitle:
                  if d.textlength(line + ch, font=f) > 630 and line:
                      lines.append(line)
                      line = ch
                  else:
                      line += ch
              if line:
                  lines.append(line)
              y = 324
              for line in lines[:2]:
                  d.text((94, y), line, font=f, fill='#52665b')
                  y += 45
              x = 92
              for tag in list(tags)[:3]:
                  tf = font(21, True)
                  width = int(d.textlength(tag, font=tf)) + 40
                  rr(d, [x, 470, x + width, 514], 22, '#e7f2e9')
                  d.text((x + 20, 480), tag, font=tf, fill='#245b41')
                  x += width + 12
              if typ:
                  d.text((836, 328), typ, font=font(45, True), fill='#183c2d')
              d.text((92, 546), 'emoseed.lavalabs.co.kr', font=font(19, True), fill='#8a978f')
              im.save(img_dir / filename, optimize=True)

          make_og('og-image.png', '작은 디지털 정원', '나와 닮은 식물, 오늘의 운세와 감성 이름을 만나보세요.', '', ['회원가입 없음','1분 테스트','결과 저장'])
          for typ, name, tagline, quote, tags in plants:
              make_og(f'og-{typ.lower()}.png', f'{typ} · {name}', tagline, typ, tags)

          def make_icon(size, filename, mask=False):
              im = Image.new('RGBA', (size, size), (246, 251, 246, 255))
              d = ImageDraw.Draw(im)
              pad = int(size * (0.13 if mask else 0.06))
              rr(d, [pad, pad, size-pad, size-pad], int(size*.22), '#dceee1')
              draw_leaf(d, size*.5, size*.43, size/570)
              d.text((size*.405, size*.66), 'E', font=font(int(size*.18), True), fill='#183c2d')
              im.save(img_dir / filename, optimize=True)

          make_icon(180, 'apple-touch-icon.png')
          make_icon(192, 'icon-192.png')
          make_icon(512, 'icon-512.png')
          make_icon(512, 'icon-maskable-512.png', True)

          manifest = {
            'name': 'EmoSeed — 작은 디지털 정원',
            'short_name': 'EmoSeed',
            'description': '매일 마음을 식물처럼 천천히 들여다보는 작은 디지털 정원',
            'start_url': '/', 'scope': '/', 'display': 'standalone',
            'background_color': '#f6fbf6', 'theme_color': '#2f6f50', 'lang': 'ko-KR',
            'icons': [
              {'src':'/assets/images/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'/assets/images/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'/assets/images/icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
            ],
            'shortcuts': [
              {'name':'오늘의 식물 운세','url':'/fortune/result.html','description':'오늘의 식물 메시지 보기'},
              {'name':'나와 닮은 식물','url':'/mbti/index.html','description':'EmoSeed Type 테스트 시작'},
            ]
          }
          write('manifest.webmanifest', json.dumps(manifest, ensure_ascii=False, indent=2))

          v3js = r'''(() => {
            const KEY = { garden:'emoseed-garden-v3', feedback:'emoseed-feedback-v3', analytics:'emoseed-analytics-v3', recent:'emoseed-recent-v3' };
            const validTypes = ['INFP','INFJ','INTP','INTJ','ISFP','ISTP','ISFJ','ISTJ','ENFP','ENFJ','ENTP','ENTJ','ESFP','ESTP','ESFJ','ESTJ'];
            const read = (key, fallback=[]) => { try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch (_) { return fallback; } };
            const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} };
            const todayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const toast = (message) => window.EmoSeedApp?.toast?.(message);
            const currentType = () => {
              const query = new URLSearchParams(location.search).get('type')?.toUpperCase();
              if (validTypes.includes(query)) return query;
              const pathMatch = location.pathname.match(/\/type\/([a-z]{4})\/?/i)?.[1]?.toUpperCase();
              if (validTypes.includes(pathMatch)) return pathMatch;
              const text = document.querySelector('.result-kicker, #resultType')?.textContent || '';
              return validTypes.find((type) => text.includes(type)) || '';
            };
            const currentName = () => document.querySelector('.result-title, #plantName, #mainResult')?.textContent?.trim() || '';

            function localTrack(eventName, detail={}) {
              const queue = read(KEY.analytics, []);
              queue.push({ eventName, ...detail, path:location.pathname, at:new Date().toISOString() });
              save(KEY.analytics, queue.slice(-250));
            }
            window.addEventListener('emoseed:analytics', (event) => localTrack(event.detail?.eventName || 'event', event.detail || {}));

            function recordRecent() {
              if (!/result\.html|\/type\//.test(location.pathname)) return;
              setTimeout(() => {
                const type = currentType();
                const name = currentName();
                if (!type && !name) return;
                const recent = read(KEY.recent, []).filter((item) => !(item.type === type && item.name === name));
                recent.unshift({ type, name, url: location.href, date: todayKey() });
                save(KEY.recent, recent.slice(0, 3));
                renderRecent();
              }, 550);
            }

            function renderRecent() {
              document.querySelectorAll('[data-v3-recent]').forEach((target) => {
                const recent = read(KEY.recent, []);
                target.innerHTML = `<div class="garden-card"><span class="eyebrow">Recently Bloomed</span><h2>최근 만난 식물</h2>${recent.length ? `<div class="related-grid">${recent.map((item) => `<a class="related-card" href="${item.url}"><strong>${item.type || '🌿'} ${item.name}</strong><span>${item.date}에 만난 결과</span></a>`).join('')}</div>` : '<p>아직 만난 결과가 없어요. 첫 테스트를 시작해보세요.</p>'}</div>`;
              });
            }

            function recordGarden(data) {
              const key = data.date || todayKey();
              const list = read(KEY.garden, []).filter((entry) => entry.date !== key);
              list.push({ date:key, plant:data.plant || '오늘의 식물', type:data.type || '', mood:data.mood || '', at:new Date().toISOString() });
              list.sort((a,b) => a.date.localeCompare(b.date));
              save(KEY.garden, list.slice(-35));
              renderGarden();
              localTrack('garden_record', { date:key, plant:data.plant, mood:data.mood || '' });
            }

            function renderGarden() {
              const entries = read(KEY.garden, []);
              document.querySelectorAll('[data-v3-garden]').forEach((target) => {
                const days = [];
                for (let i=6; i>=0; i-=1) {
                  const d = new Date(); d.setDate(d.getDate()-i);
                  const key = todayKey(d); days.push({ key, label:`${d.getMonth()+1}/${d.getDate()}`, entry:entries.find((e) => e.date === key) });
                }
                const filled = days.filter((day) => day.entry).length;
                const moods = days.map((day) => day.entry?.mood).filter(Boolean);
                const summary = filled === 7 ? '이번 주 정원이 모두 피었어요. 천천히 이어온 기록이 꽤 단단합니다.' : filled >= 4 ? '정원이 절반 이상 피었어요. 며칠만 더 이어가면 이번 주 마음의 리듬이 보여요.' : '오늘의 운세를 열 때마다 정원에 식물이 하나씩 심어집니다.';
                const moodText = moods.length ? `이번 주에 남긴 마음: ${moods.join(' · ')}` : '감정을 함께 기록하면 한 주의 마음 흐름도 볼 수 있어요.';
                target.innerHTML = `<div class="garden-card"><span class="eyebrow">My 7-day Garden</span><h2>나의 7일 정원</h2><p>${summary}</p><div class="garden-strip">${days.map((day) => day.entry ? `<div class="garden-day" title="${day.entry.plant}${day.entry.mood ? ` · ${day.entry.mood}` : ''}"><span>🌿</span><strong>${day.entry.plant}</strong><small>${day.label}</small></div>` : `<div class="garden-day empty"><span>·</span><strong>비어있음</strong><small>${day.label}</small></div>`).join('')}</div><p class="disclaimer">${moodText}<br>기록은 이 기기의 브라우저에만 저장됩니다.</p></div>`;
              });
            }

            function initFeedback() {
              document.querySelectorAll('[data-v3-feedback]').forEach((box) => {
                box.querySelectorAll('[data-feedback-value]').forEach((button) => button.addEventListener('click', () => {
                  box.querySelectorAll('[data-feedback-value]').forEach((item) => item.setAttribute('aria-pressed', item === button ? 'true' : 'false'));
                  const list = read(KEY.feedback, []);
                  const payload = { target:box.dataset.v3Feedback, value:button.dataset.feedbackValue, result:currentType() || currentName(), at:new Date().toISOString() };
                  list.push(payload); save(KEY.feedback, list.slice(-100)); localTrack('feedback_submit', payload);
                  toast('피드백을 저장했어요. 다음 정원 개선에 참고할게요.');
                }));
              });
            }

            function compatibility(a,b) {
              let score = 58;
              for (let i=0;i<4;i+=1) score += a[i] === b[i] ? 8 : 3;
              return Math.min(98, score);
            }

            function initFriendCompare() {
              const invited = new URLSearchParams(location.search).get('friendType')?.toUpperCase();
              if (validTypes.includes(invited)) sessionStorage.setItem('emoseed-friend-type', invited);
              setTimeout(() => {
                const mine = currentType();
                const friend = sessionStorage.getItem('emoseed-friend-type');
                const target = document.querySelector('[data-v3-friend]');
                if (target && validTypes.includes(mine)) {
                  const inviteUrl = `${location.origin}/mbti/index.html?friendType=${mine}`;
                  if (validTypes.includes(friend) && friend !== mine) {
                    const score = compatibility(mine, friend);
                    target.innerHTML = `<div class="garden-card"><span class="eyebrow">Friend Garden</span><h2>${friend} 친구와 나의 정원 궁합</h2><p><strong>${score}점</strong> · 서로의 다른 리듬을 알아갈수록 더 풍성해지는 조합이에요.</p><div class="button-row"><button class="primary-button" type="button" data-friend-share>친구에게 결과 공유</button><a class="secondary-button" href="${inviteUrl}">다른 친구 초대</a></div></div>`;
                    target.querySelector('[data-friend-share]')?.addEventListener('click', () => window.EmoSeedApp?.share?.({ title:`${mine}와 ${friend}의 정원 궁합`, text:`우리의 EmoSeed 정원 궁합은 ${score}점이에요.`, url:location.href }));
                  } else {
                    target.innerHTML = `<div class="garden-card"><span class="eyebrow">Friend Garden</span><h2>친구와 식물 유형을 비교해보세요</h2><p>친구가 테스트를 끝내면 두 사람의 정원 궁합을 바로 보여드려요.</p><div class="button-row"><button class="primary-button" type="button" data-copy-invite>친구에게 테스트 보내기</button></div></div>`;
                    target.querySelector('[data-copy-invite]')?.addEventListener('click', () => window.EmoSeedApp?.share?.({ title:'나와 닮은 식물 테스트', text:`나는 ${mine} 유형이 나왔어요. 너의 식물도 만나볼래?`, url:inviteUrl }));
                  }
                }
              }, 650);
            }

            function wrapShareForStaticType() {
              setTimeout(() => {
                const type = currentType();
                if (!validTypes.includes(type) || !window.EmoSeedApp?.share) return;
                const fixed = `${location.origin}/type/${type.toLowerCase()}/`;
                document.querySelectorAll('[data-copy-link]').forEach((button) => button.dataset.copyLink = fixed);
                if (window.EmoSeedApp.share.__v3wrapped) return;
                const original = window.EmoSeedApp.share;
                const wrapped = (options={}) => original({ ...options, url: validTypes.includes(currentType()) ? `${location.origin}/type/${currentType().toLowerCase()}/` : options.url });
                wrapped.__v3wrapped = true;
                window.EmoSeedApp.share = wrapped;
              }, 700);
            }

            function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines=8) {
              const chars = Array.from(text || ''); let line=''; let lines=[];
              chars.forEach((ch) => { const test=line+ch; if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line=ch; } else line=test; });
              if (line) lines.push(line); lines=lines.slice(0,maxLines);
              lines.forEach((value,index) => ctx.fillText(value,x,y+index*lineHeight));
              return y+lines.length*lineHeight;
            }

            async function resultImage(format='post') {
              const sizes = { story:[1080,1920], post:[1080,1350], link:[1200,630] };
              const [w,h] = sizes[format] || sizes.post;
              const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
              const ctx=canvas.getContext('2d'); ctx.fillStyle='#f6fbf6'; ctx.fillRect(0,0,w,h);
              const margin=Math.round(w*.075); const top=Math.round(h*.08);
              ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(margin,top,w-margin*2,h-top*2,Math.round(w*.035)); ctx.fill();
              const title=currentName() || document.querySelector('h1')?.textContent?.trim() || 'EmoSeed Result';
              const kicker=document.querySelector('.result-kicker, #resultType')?.textContent?.trim() || 'EMOSEED · DIGITAL GARDEN';
              const subtitle=document.querySelector('.result-subtitle, #resultMessage, #fortuneMessage, #plantMessage')?.textContent?.trim() || '오늘의 마음에 작은 씨앗 하나';
