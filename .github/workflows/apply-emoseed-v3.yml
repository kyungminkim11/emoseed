name: Apply EmoSeed v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-emoseed-v3.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out deployment payload
        uses: actions/checkout@v4
        with:
          ref: v3-payload
          path: payload

      - name: Rebuild and verify bundle
        shell: bash
        run: |
          cat payload/.deploy-v3/chunk-* > /tmp/emoseed-v3.tar.gz.b64
          base64 --decode /tmp/emoseed-v3.tar.gz.b64 > /tmp/emoseed-v3.tar.gz
          echo "fe3b9128daf12363373dd583c21c9f4435e6a6caed249ac2df12dc23b3156a60  /tmp/emoseed-v3.tar.gz" | sha256sum --check --strict

      - name: Apply EmoSeed v3
        shell: bash
        run: |
          tar -xzf /tmp/emoseed-v3.tar.gz -C site
          rm -f site/.github/workflows/apply-emoseed-v3.yml

      - name: Commit and push
        shell: bash
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Launch EmoSeed v3 experience"
          git push
