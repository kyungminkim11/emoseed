          from pathlib import Path
          import re
          broken=[]
          for page in Path('.').rglob('*.html'):
              text=page.read_text(encoding='utf-8')
              for value in re.findall(r'(?:href|src)="([^"]+)"',text):
                  if value.startswith(('http:','https:','mailto:','tel:','#','data:','javascript:')): continue
                  clean=value.split('?',1)[0].split('#',1)[0]
                  if not clean: continue
                  target=(page.parent/clean).resolve()
                  if clean.endswith('/'): target=target/'index.html'
                  if not target.exists(): broken.append((str(page),value))
          if broken:
              raise SystemExit('Broken links: '+repr(broken[:20]))
          print('HTML/link validation passed')
          PY

