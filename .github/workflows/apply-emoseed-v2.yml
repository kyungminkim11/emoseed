name: Apply EmoSeed redesign

on:
  push:
    branches:
      - main
    paths:
      - ".deploy/ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and verify deployment bundle
        shell: bash
        run: |
          cat .deploy/chunk-* > /tmp/emoseed-v2.tar.gz.b64
          base64 --decode /tmp/emoseed-v2.tar.gz.b64 > /tmp/emoseed-v2.tar.gz
          echo "0af14b6aaf062ea7cde5893452576c110581220d1aafb3a7cba819d2fce6982f  /tmp/emoseed-v2.tar.gz" | sha256sum --check --strict

      - name: Apply redesigned site
        shell: bash
        run: |
          tar -xzf /tmp/emoseed-v2.tar.gz -C .
          rm -rf .deploy
          rm -f .github/workflows/apply-emoseed-v2.yml

      - name: Commit redesigned site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign EmoSeed experience"
          git push
