name: Fix gift planner observer loop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gift-planner-observer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent repeated order text mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('flowers/gifts-plus.js')
          s=p.read_text(encoding='utf-8')
          old="target.textContent=`${base}${marker}선물 형태는 ${style}, 전달 방식은 ${delivery}입니다. ${seasonal} ${petText}`.trim();"
          new="const nextText=`${base}${marker}선물 형태는 ${style}, 전달 방식은 ${delivery}입니다. ${seasonal} ${petText}`.trim();\n    if(target.textContent!==nextText) target.textContent=nextText;"
          if old not in s:
              raise SystemExit('target line not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8').replace("emoseed-gift-planner-v2-20260630","emoseed-gift-planner-v2-fixed-20260630")
          p.write_text(s,encoding='utf-8')
          PY
          node --check flowers/gifts-plus.js
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-gift-planner-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent repeated gift planner updates' || exit 0
          git push
