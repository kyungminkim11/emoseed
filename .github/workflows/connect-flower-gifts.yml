name: Connect flower gift calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-flower-gifts.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add gift calendar links
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          patch('assets/js/app.js', [
              ("${navLink('flowers', 'flowers/index.html', '꽃 도감')}\n            ${navLink('programs', 'event.html', '프로그램')}", "${navLink('flowers', 'flowers/index.html', '꽃 도감')}\n            ${navLink('gifts', 'flowers/gifts.html', '꽃 선물')}\n            ${navLink('programs', 'event.html', '프로그램')}"),
              ("${navLink('flowers', 'flowers/index.html', '<span>🌸 꽃 도감·추천</span><span>›</span>')}\n            ${navLink('programs', 'event.html', '<span>🎉 프로그램</span><span>›</span>')}", "${navLink('flowers', 'flowers/index.html', '<span>🌸 꽃 도감·추천</span><span>›</span>')}\n            ${navLink('gifts', 'flowers/gifts.html', '<span>💐 꽃 선물 캘린더</span><span>›</span>')}\n            ${navLink('programs', 'event.html', '<span>🎉 프로그램</span><span>›</span>')}"),
              ('<a href="${path(\'flowers/index.html\')}">꽃 도감</a>', '<a href="${path(\'flowers/index.html\')}">꽃 도감</a>\n            <a href="${path(\'flowers/gifts.html\')}">꽃 선물</a>')
          ])

          patch('flowers/index.html', [
              ('<a class="secondary-button" href="#recommend">상황별 추천</a>', '<a class="secondary-button" href="#recommend">상황별 추천</a>\n          <a class="secondary-button" href="gifts.html">💐 꽃 선물 캘린더</a>')
          ])

          patch('index.html', [
              ('<div><div class="feature-icon">💐</div><h3>상황별 꽃 추천</h3><p>감사, 위로, 생일, 새로운 시작과 오늘의 감정에 어울리는 꽃을 추천해드려요.</p></div>\n      <div class="feature-meta"><span>꽃집·식물원 찾기 포함</span><span>추천받기 →</span></div>', '<div><div class="feature-icon">💐</div><h3>꽃 선물 캘린더</h3><p>다가오는 기념일을 확인하고 대상·예산·상황에 맞는 꽃다발과 주문 문구를 추천받아보세요.</p></div>\n      <div class="feature-meta"><span>개인 기념일 저장 포함</span><span>선물 준비하기 →</span></div>'),
              ('href="flowers/index.html#recommend"', 'href="flowers/gifts.html"')
          ])

          patch('flowers/gifts.html', [('data-page="flowers"', 'data-page="gifts"')])
          PY
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/connect-flower-gifts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Connect flower gift calendar across EmoSeed' || exit 0
          git push
