<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="오늘의 감정과 분위기로 만들어진 세상에 하나뿐인 감성 식물 이름을 확인해보세요.">

  <meta name="robots" content="noindex,follow">

  <link rel="canonical" href="https://emoseed.lavalabs.co.kr/name-generator/result.html">

  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="나만의 식물 이름 결과 | EmoSeed">
  <meta property="og:description" content="오늘의 감정과 분위기로 만들어진 세상에 하나뿐인 감성 식물 이름을 확인해보세요.">
  <meta property="og:url" content="https://emoseed.lavalabs.co.kr/name-generator/result.html">
  <meta property="og:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나만의 식물 이름 결과 | EmoSeed">
  <meta name="twitter:description" content="오늘의 감정과 분위기로 만들어진 세상에 하나뿐인 감성 식물 이름을 확인해보세요.">
  <meta name="twitter:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">

  <script defer src="../assets/js/app.js"></script>
</head>
<body data-base="../" data-page="name">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
<section class="page-hero compact"><span class="eyebrow">🌼 EmoSeed Name Result</span><h1>오늘의 마음에서<br>새로운 이름이 피었어요</h1></section>
<section class="result-shell">
  <article class="result-card">
    <div class="result-header">
      <div>
        <div class="result-kicker">YOUR PRIVATE PLANT NAME</div>
        <h2 class="result-title" id="generatedName"></h2>
        <p class="result-subtitle" id="generatedMeaning"></p>
        <div class="keyword-list" id="nameKeywords"></div>
      </div>
      <img class="result-image" id="nameImage" alt="감성 식물 일러스트">
    </div>
    <div class="detail-grid">
      <section class="detail-card"><h3>🌿 이름의 의미</h3><p id="meaningDetail"></p></section>
      <section class="detail-card"><h3>🫧 오늘의 마음</h3><p id="heartDetail"></p></section>
      <section class="detail-card"><h3>✨ 작은 행동</h3><p id="actionDetail"></p></section>
      <section class="detail-card"><h3>🎨 어울리는 색</h3><p id="colorDetail"></p></section>
    </div>
    <div class="quote-card" id="nameQuote"></div>
  </article>
  <div class="share-panel"><p>세상에 하나뿐인 이름을 이미지로 간직해보세요.</p><div class="button-row">
    <button class="primary-button" id="saveResult" type="button">📷 이미지 저장</button>
    <button class="secondary-button" id="shareResult" type="button">공유하기</button>
    <button class="secondary-button" data-copy-link type="button">링크 복사</button>
    <a class="text-button" href="index.html">다시 만들기</a>
  </div></div>
  <div class="related-grid">
    <a class="related-card" href="../mbti/index.html"><strong>🌱 나와 닮은 식물</strong><span>내 성향의 식물 찾기</span></a>
    <a class="related-card" href="../fortune/index.html"><strong>🔮 오늘의 운세</strong><span>하루 한 번의 메시지</span></a>
    <a class="related-card" href="../compatibility/index.html"><strong>💘 식물 궁합</strong><span>식물과 나의 감성 점수</span></a>
  </div>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const emotion = params.get('emotion') || '따뜻한';
    const mood = params.get('mood') || '고요한';
    const rawKeyword = (params.get('keyword') || '').trim().slice(0, 12);
    const parts = window.EMOSEED_DATA.nameParts;
    const seed = window.EmoSeed.hash(`${emotion}|${mood}|${rawKeyword}|${window.EmoSeed.todayKey()}`);
    const prefix = rawKeyword || parts.prefix[seed % parts.prefix.length];
    const suffix = parts.suffix[(seed >> 3) % parts.suffix.length];
    let pattern = parts.patterns[(seed >> 6) % parts.patterns.length];
    if (!rawKeyword) pattern = pattern.replace('{keyword}', prefix);
    const generated = pattern.replaceAll('{keyword}', prefix).replaceAll('{mood}', mood).replaceAll('{emotion}', emotion).replaceAll('{prefix}', parts.prefix[(seed >> 9) % parts.prefix.length]).replaceAll('{suffix}', suffix);
    const plant = window.EMOSEED_DATA.plants[seed % window.EMOSEED_DATA.plants.length];
    const colors = ['연둣빛 안개', '따뜻한 살구빛', '새벽의 연보라', '맑은 하늘빛', '노을을 닮은 장밋빛', '고요한 숲의 초록'];
    const actions = ['좋아하는 노래 한 곡을 끝까지 들어보세요.', '창문을 열고 세 번 천천히 숨을 쉬어보세요.', '오늘 고마웠던 순간을 한 줄 적어보세요.', '10분 동안 휴대폰을 내려놓고 따뜻한 음료를 마셔보세요.', '지금 떠오르는 사람에게 짧은 안부를 보내보세요.', '오늘의 하늘을 사진 한 장으로 남겨보세요.'];
    const color = colors[(seed >> 12) % colors.length];
    const action = actions[(seed >> 15) % actions.length];
    const quote = `${generated}은(는) 완벽하게 피기 위해 서두르지 않아요. 오늘의 마음도 그대로 충분합니다.`;
    const imageSrc = `../assets/images/${plant.type.toLowerCase()}.svg`;
    document.getElementById('generatedName').textContent = generated;
    document.getElementById('generatedMeaning').textContent = `${mood} 분위기와 ${emotion} 감정${rawKeyword ? `, ‘${rawKeyword}’이라는 단어` : ''}에서 태어난 이름이에요.`;
    document.getElementById('nameKeywords').innerHTML = [emotion, mood, rawKeyword || prefix].map((item) => `<span class="keyword">${item}</span>`).join('');
    document.getElementById('meaningDetail').textContent = `‘${generated}’은 오늘의 감정을 억지로 바꾸기보다, 조용히 이름 붙여 바라보는 마음을 뜻해요.`;
    document.getElementById('heartDetail').textContent = `${emotion} 마음과 ${mood} 공기가 함께 머무는 날이에요. 지금 느끼는 감정을 서둘러 정리하지 않아도 괜찮아요.`;
    document.getElementById('actionDetail').textContent = action;
    document.getElementById('colorDetail').textContent = `${color}이 오늘의 이름과 가장 잘 어울려요.`;
    document.getElementById('nameQuote').textContent = `“${quote}”`;
    const image = document.getElementById('nameImage'); image.src = imageSrc; image.alt = `${generated}을 표현한 식물 일러스트`;
    document.getElementById('saveResult').addEventListener('click', () => window.EmoSeedApp.downloadResultImage({
      kicker: 'EMOSEED NAME', title: generated, subtitle: document.getElementById('generatedMeaning').textContent,
      keywords: [emotion, mood, rawKeyword || prefix], message: document.getElementById('meaningDetail').textContent, quote, imageSrc,
      filename: `EmoSeed_${generated}.png`
    }));
    document.getElementById('shareResult').addEventListener('click', () => window.EmoSeedApp.shareResultImage({ kicker: 'EMOSEED NAME', title: generated, subtitle: document.getElementById('generatedMeaning').textContent, keywords: [emotion, mood, rawKeyword || prefix], message: document.getElementById('meaningDetail').textContent, quote, imageSrc, filename: `EmoSeed_${generated}.png` }, { title: `나의 식물 이름은 ‘${generated}’`, text: quote, url: location.href }));
    window.EmoSeedApp.track('result_view', { test: 'name', result: generated });
  });
</script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
