<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmoSeed Name 결과</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem}.theme-link{cursor:pointer;font-weight:500;margin:0 .2rem}</style></head><body><div class="wrapper"><main class="content"><nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="../mbti/index.html">🌱 EmoSeed Type</a><a href="../compatibility/index.html">💘 EmoSeed Match</a><a href="index.html" class="active">🌼 EmoSeed Name</a><a href="../fortune/index.html">🔮 EmoSeed Fortune</a></div></nav>
<section id="capture-area" style="padding:2rem 1rem;text-align:center"><h1>✨ 당신의 힐링 식물 이름은</h1><h2 id="plantName" style="font-size:2rem;color:#4a774a;margin:1rem 0"></h2><p id="plantMessage" style="color:#555"></p></section><div style="text-align:center;margin-top:2rem"><button onclick="saveResult()">📋 결과 저장하기</button><button onclick="copyLink()">🔗 링크 복사하기</button><button onclick="shareEmail()">📧 이메일로 보내기</button><button onclick="location.href='index.html'">↩️ 다시 만들기</button></div><hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('mbti')">🌿 EmoSeed Type</button><button onclick="goTo('compatibility')">🌿 EmoSeed Match</button><button onclick="goTo('fortune')">🌿 EmoSeed Fortune</button></div><div class="theme-status" id="themeStatus"></div><div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const p=new URLSearchParams(location.search),emotion=p.get('emotion')||'따뜻한',mood=p.get('mood')||'차분한',keyword=p.get('keyword')||'',name=`${mood}${keyword?' '+keyword:''}${emotion}잎`;document.getElementById('plantName').textContent=`<${name}> 입니다!`;document.getElementById('plantMessage').textContent='당신의 감정에 어울리는 식물 이름이에요. 오늘 하루도 부드럽게 흘러가길 바랄게요.';function saveResult(){html2canvas(document.getElementById('capture-area')).then(c=>{const a=document.createElement('a');a.download=`감성식물이름_${name}.png`;a.href=c.toDataURL('image/png');a.click()})}function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareEmail(){location.href=`mailto:?subject=${encodeURIComponent('🌿 나만의 식물 이름: '+name)}&body=${encodeURIComponent(`제가 만든 감성 식물 이름은 <${name}> 입니다!\n\n${location.href}`)}`}function goTo(f){location.href=`../${f}/index.html`}const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'};function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)</script></main></div></body></html>
