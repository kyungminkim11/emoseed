<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나만의 감성 식물 이름 만들기 | EmoSeed</title>
  <meta name="description" content="지금의 감정과 분위기, 마음에 담긴 단어로 세상에 하나뿐인 식물 이름을 만들어보세요.">
  <meta name="theme-color" content="#f6fbf6">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://emoseed.lavalabs.co.kr/name-generator/">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EmoSeed">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="나만의 감성 식물 이름 만들기 | EmoSeed">
  <meta property="og:description" content="지금의 감정과 분위기, 마음에 담긴 단어로 세상에 하나뿐인 식물 이름을 만들어보세요.">
  <meta property="og:url" content="https://emoseed.lavalabs.co.kr/name-generator/">
  <meta property="og:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나만의 감성 식물 이름 만들기 | EmoSeed">
  <meta name="twitter:description" content="지금의 감정과 분위기, 마음에 담긴 단어로 세상에 하나뿐인 식물 이름을 만들어보세요.">
  <meta name="twitter:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <script defer src="../assets/js/data.js"></script>
  <script defer src="../assets/js/app.js"></script>
</head>
<body data-base="../" data-page="name">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
<section class="page-hero">
  <span class="eyebrow">🌼 EmoSeed Name</span>
  <h1>오늘의 마음에<br>이름을 붙여볼까요?</h1>
  <p>감정과 분위기, 떠오르는 단어를 골라주세요. 단순히 단어를 이어 붙이지 않고 자연스러운 식물 이름으로 피워드릴게요.</p>
</section>
<section class="narrow content-card">
  <form id="nameForm">
    <fieldset class="form-group" style="border:0;padding:0;margin:0">
      <legend class="input-label">1. 지금 가장 가까운 감정</legend>
      <div class="chip-grid" id="emotionGrid"></div>
    </fieldset>
    <fieldset class="form-group" style="border:0;padding:0">
      <legend class="input-label">2. 오늘의 분위기</legend>
      <div class="chip-grid" id="moodGrid"></div>
    </fieldset>
    <div class="form-group">
      <label class="input-label" for="keyword">3. 마음에 담긴 단어 <span style="color:var(--muted);font-weight:500">(선택)</span></label>
      <input class="text-input" id="keyword" maxlength="12" autocomplete="off" placeholder="예: 별빛, 봄날, 여행">
    </div>
    <div class="button-row" style="justify-content:center"><button class="primary-button" type="submit">✨ 식물 이름 피우기</button></div>
  </form>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const makeChips = (items, name) => items.map((item, index) => `<label class="select-chip"><input type="radio" name="${name}" value="${item.value}" ${index === 0 ? 'checked' : ''}><span>${item.emoji} ${item.value}</span></label>`).join('');
    document.getElementById('emotionGrid').innerHTML = makeChips(window.EMOSEED_DATA.emotions, 'emotion');
    document.getElementById('moodGrid').innerHTML = makeChips(window.EMOSEED_DATA.moods, 'mood');
    document.getElementById('nameForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const emotion = new FormData(event.currentTarget).get('emotion');
      const mood = new FormData(event.currentTarget).get('mood');
      const keyword = document.getElementById('keyword').value.trim().replace(/[<>]/g, '');
      window.EmoSeedApp.track('test_complete', { test: 'name', emotion, mood });
      location.href = `result.html?emotion=${encodeURIComponent(emotion)}&mood=${encodeURIComponent(mood)}&keyword=${encodeURIComponent(keyword)}`;
    });
  });
</script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
