<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmoSeed Name | 감성을 심는 브랜드</title><meta name="description" content="당신의 감정과 분위기를 담은 나만의 식물 이름을 지어보세요."><link rel="stylesheet" href="../assets/css/style.css"><style>body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem}.theme-link{cursor:pointer;font-weight:500;margin:0 .2rem}.share-box{text-align:center;margin:4rem 1rem 3rem}.share-buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:1rem}</style></head><body><div class="wrapper"><main class="content"><nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="../mbti/index.html">🌱 EmoSeed Type</a><a href="../compatibility/index.html">💘 EmoSeed Match</a><a href="index.html" class="active">🌼 EmoSeed Name</a><a href="../fortune/index.html">🔮 EmoSeed Fortune</a></div></nav>
<section class="header-message" style="padding:2rem 1rem;text-align:center"><h1>🌿 EmoSeed Name</h1><p>당신의 감정과 분위기를 담아<br>감성 식물 이름을 지어드릴게요!</p></section><section style="padding:1rem;max-width:600px;margin:auto"><h3>1. 지금 나의 감정을 선택해주세요 🌱</h3><label><input type="radio" name="emotion" value="따뜻한"> 따뜻한</label><br><label><input type="radio" name="emotion" value="슬픈"> 슬픈</label><br><label><input type="radio" name="emotion" value="기쁜"> 기쁜</label><br><label><input type="radio" name="emotion" value="외로운"> 외로운</label><h3 style="margin-top:2rem">2. 오늘의 분위기를 선택해주세요 🌼</h3><label><input type="radio" name="mood" value="차분한"> 차분한</label><br><label><input type="radio" name="mood" value="몽환적인"> 몽환적인</label><br><label><input type="radio" name="mood" value="싱그러운"> 싱그러운</label><br><label><input type="radio" name="mood" value="고요한"> 고요한</label><h3 style="margin-top:2rem">3. 마음에 담긴 단어가 있다면 입력해주세요 ✏️</h3><input id="keywordInput" placeholder="예: 햇살, 별빛, 봄날..." style="padding:.5rem;width:100%;max-width:400px"><div style="text-align:center;margin-top:2.5rem"><button onclick="generateName()">✨ 이름 생성하기</button></div></section>
<hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('mbti')">🌿 EmoSeed Type</button><button onclick="goTo('compatibility')">🌿 EmoSeed Match</button><button onclick="goTo('fortune')">🌿 EmoSeed Fortune</button></div><div class="theme-status" id="themeStatus"></div><div class="share-box"><p><b>이 감성 페이지, 친구에게도 공유해보세요 🌿</b></p><div class="share-buttons"><button onclick="copyLink()">🔗 링크 복사</button><button onclick="shareEmail()">📧 이메일 공유</button></div></div><div id="footer-placeholder"></div>
<script>function generateName(){const e=document.querySelector('input[name="emotion"]:checked'),m=document.querySelector('input[name="mood"]:checked'),k=document.getElementById('keywordInput').value.trim();if(!e||!m)return alert('감정과 분위기를 모두 선택해주세요!');location.href=`result.html?emotion=${encodeURIComponent(e.value)}&mood=${encodeURIComponent(m.value)}&keyword=${encodeURIComponent(k)}`}function goTo(f){location.href=`../${f}/index.html`}const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'};function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareEmail(){location.href=`mailto:?subject=${encodeURIComponent('🌿 EmoSeed Name, 나만의 식물 이름을 지어보세요!')}&body=${encodeURIComponent(location.href)}`}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)</script></main></div></body></html>
