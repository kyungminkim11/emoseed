<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>식물 궁합 테스트 | EmoSeed</title>
  <meta name="description" content="닉네임과 마음에 드는 식물을 선택해 감성 궁합 점수와 가장 잘 맞는 식물을 확인해보세요.">
  <meta name="theme-color" content="#f6fbf6">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://emoseed.lavalabs.co.kr/compatibility/">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EmoSeed">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="식물 궁합 테스트 | EmoSeed">
  <meta property="og:description" content="닉네임과 마음에 드는 식물을 선택해 감성 궁합 점수와 가장 잘 맞는 식물을 확인해보세요.">
  <meta property="og:url" content="https://emoseed.lavalabs.co.kr/compatibility/">
  <meta property="og:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="식물 궁합 테스트 | EmoSeed">
  <meta name="twitter:description" content="닉네임과 마음에 드는 식물을 선택해 감성 궁합 점수와 가장 잘 맞는 식물을 확인해보세요.">
  <meta name="twitter:image" content="https://emoseed.lavalabs.co.kr/assets/images/og-image.svg">
  <script defer src="../assets/js/data.js"></script>
  <script defer src="../assets/js/app.js"></script>
</head>
<body data-base="../" data-page="match">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
<section class="page-hero">
  <span class="eyebrow">💘 EmoSeed Match</span>
  <h1>나와 이 식물,<br>얼마나 잘 맞을까요?</h1>
  <p>닉네임과 마음에 드는 식물을 골라보세요. 입력한 닉네임은 서버로 전송하지 않으며 현재 브라우저에서만 사용합니다.</p>
</section>
<section class="narrow content-card">
  <div class="form-group">
    <label class="input-label" for="nickname">닉네임</label>
    <input class="text-input" id="nickname" maxlength="20" autocomplete="off" placeholder="예: 초록여행자">
  </div>
  <div class="form-group">
    <span class="input-label">마음이 가는 식물을 하나 골라주세요</span>
    <div class="plant-grid" id="plantGrid" role="listbox" aria-label="식물 선택"></div>
  </div>
  <div class="button-row" style="justify-content:center"><button class="primary-button" id="matchSubmit" type="button" disabled>💘 궁합 결과 보기</button></div>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('plantGrid');
    const nameInput = document.getElementById('nickname');
    const submit = document.getElementById('matchSubmit');
    let selected = '';
    grid.innerHTML = window.EMOSEED_DATA.plants.map((plant) => `
      <button class="plant-card" type="button" data-plant="${plant.name}" role="option" aria-selected="false">
        <img src="../assets/images/${plant.type.toLowerCase()}.svg" alt="${plant.name}">
        <strong>${plant.name}</strong><small>${plant.type}</small>
      </button>`).join('');
    function validate() { submit.disabled = !nameInput.value.trim() || !selected; }
    grid.querySelectorAll('.plant-card').forEach((card) => card.addEventListener('click', () => {
      selected = card.dataset.plant;
      grid.querySelectorAll('.plant-card').forEach((item) => {
        const active = item === card;
        item.classList.toggle('selected', active);
        item.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      validate();
    }));
    nameInput.addEventListener('input', validate);
    submit.addEventListener('click', () => {
      const nickname = nameInput.value.trim();
      if (!nickname || !selected) return;
      const score = window.EmoSeed.hash(`${nickname}|${selected}`) % 101;
      sessionStorage.setItem('emoseed-match-name', nickname);
      window.EmoSeedApp.track('test_complete', { test: 'match', plant: selected, score });
      location.href = `result.html?plant=${encodeURIComponent(selected)}&score=${score}`;
    });
  });
</script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
