<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmoSeed Match | 감성을 심는 브랜드</title><meta name="description" content="당신의 이름과 궁합이 맞는 식물을 찾아보세요."><link rel="stylesheet" href="../assets/css/style.css"><style>
.plant-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1rem}.plant-card{border:2px solid #ccc;border-radius:12px;padding:.5rem;text-align:center;cursor:pointer;transition:.2s}.plant-card.selected{border-color:#4a774a;background:#f0f7f0}.plant-card img{width:100%;max-height:120px;border-radius:8px;object-fit:contain}body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem}.theme-link{cursor:pointer;font-weight:500;margin:0 .2rem}.share-box{text-align:center;margin:4rem 1rem 3rem}.share-buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:1rem}@media(max-width:600px){.plant-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrapper"><main class="content"><nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="../mbti/index.html">🌱 EmoSeed Type</a><a class="active" href="index.html">💘 EmoSeed Match</a><a href="../name-generator/index.html">🌼 EmoSeed Name</a><a href="../fortune/index.html">🔮 EmoSeed Fortune</a></div></nav>
<section class="header-message" style="padding:2rem 1rem;text-align:center"><h1>🌿 EmoSeed Match</h1><p>당신의 이름을 입력하고 궁합이 맞는 식물을 찾아보세요!</p><input id="userName" placeholder="당신의 이름을 입력하세요" style="margin-top:1rem;padding:.5rem;width:80%;max-width:300px"></section><section style="padding:1rem"><h3 style="text-align:center">16가지 식물 중 하나를 선택해주세요 🌱</h3><div class="plant-grid" id="plantGrid"></div><div style="text-align:center;margin-top:2rem"><p>또는 식물 이름을 직접 입력할 수도 있어요</p><input id="customPlant" placeholder="식물 이름 입력" style="padding:.5rem;width:80%;max-width:300px"></div><div style="text-align:center;margin-top:2rem"><button onclick="submitCompatibility()">💘 결과 보기</button></div></section>
<hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('mbti')">🌿 EmoSeed Type</button><button onclick="goTo('name-generator')">🌿 EmoSeed Name</button><button onclick="goTo('fortune')">🌿 EmoSeed Fortune</button></div><div class="theme-status" id="themeStatus"></div><div class="share-box"><p><b>이 감성 페이지, 친구에게도 공유해보세요 🌿</b></p><div class="share-buttons"><button onclick="copyLink()">🔗 링크 복사</button><button onclick="shareEmail()">📧 이메일 공유</button></div></div><div id="footer-placeholder"></div>
<script>
const map={무궁화:'INFP',라벤더:'INFJ',민트:'INTP',스투키:'INTJ',수국:'ISFP',선인장:'ISTP',알로에:'ISFJ',대나무:'ISTJ',해바라기:'ENFP',장미:'ENFJ',페퍼민트:'ENTP',튤립:'ENTJ',코스모스:'ESFP',장미허브:'ESTP',카네이션:'ESFJ',유칼립투스:'ESTJ'},grid=document.getElementById('plantGrid');let selected='';Object.entries(map).forEach(([name,mbti])=>{const card=document.createElement('div');card.className='plant-card';card.innerHTML=`<img src="../assets/images/${mbti.toLowerCase()}.svg" alt="${name}"><p>${name}</p>`;card.onclick=()=>{document.querySelectorAll('.plant-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selected=name;document.getElementById('customPlant').value=''};grid.appendChild(card)});function submitCompatibility(){const name=document.getElementById('userName').value.trim(),plant=selected||document.getElementById('customPlant').value.trim();if(!name)return alert('이름을 입력해주세요!');if(!plant)return alert('식물을 선택하거나 입력해주세요!');location.href=`result.html?name=${encodeURIComponent(name)}&plant=${encodeURIComponent(plant)}`}function goTo(f){location.href=`../${f}/index.html`}const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'};function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareEmail(){location.href=`mailto:?subject=${encodeURIComponent('🌿 EmoSeed Match')}&body=${encodeURIComponent(location.href)}`}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)
</script></main></div></body></html>
