<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmoSeed Match 결과</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem}.theme-link{cursor:pointer;font-weight:500;margin:0 .2rem}</style></head><body><div class="wrapper"><main class="content"><nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="../mbti/index.html">🌱 EmoSeed Type</a><a href="index.html" class="active">💘 EmoSeed Match</a><a href="../name-generator/index.html">🌼 EmoSeed Name</a><a href="../fortune/index.html">🔮 EmoSeed Fortune</a></div></nav>
<section id="capture-area" style="padding:2rem 1rem;text-align:center"><h1>💘 식물 궁합 테스트 결과</h1><p id="mainResult" style="font-size:1.5rem"></p><p id="resultMessage" style="color:#555"></p><img id="plantImage" alt="선택한 식물" style="margin:1.5rem auto 0;max-width:250px;height:auto;object-fit:contain;border-radius:12px;display:block"><p style="margin-top:2rem;font-weight:bold">💡 가장 궁합이 좋은 식물</p><p id="bestMatch" style="font-size:1.2rem"></p></section>
<div style="text-align:center;margin-top:2rem"><button onclick="saveResult()">📋 결과 저장하기</button><button onclick="copyLink()">🔗 링크 복사하기</button><button onclick="shareByEmail()">📧 이메일로 공유하기</button><button onclick="location.href='index.html'">↩️ 다시 테스트하기</button></div><hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('mbti')">🌿 EmoSeed Type</button><button onclick="goTo('name-generator')">🌿 EmoSeed Name</button><button onclick="goTo('fortune')">🌿 EmoSeed Fortune</button></div><div class="theme-status" id="themeStatus"></div><div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const map={무궁화:'INFP',라벤더:'INFJ',민트:'INTP',스투키:'INTJ',수국:'ISFP',선인장:'ISTP',알로에:'ISFJ',대나무:'ISTJ',해바라기:'ENFP',장미:'ENFJ',페퍼민트:'ENTP',튤립:'ENTJ',코스모스:'ESFP',장미허브:'ESTP',카네이션:'ESFJ',유칼립투스:'ESTJ'},q=new URLSearchParams(location.search),userName=q.get('name')||'사용자',selectedPlant=q.get('plant')||'무궁화';function score(a,b){return[...(a+b)].reduce((s,c)=>s+c.charCodeAt(0),0)%101}function message(s){return s>=90?'이보다 더 좋을 수 없는 찰떡 궁합이에요! 💘':s>=70?'서로가 서로를 잘 이해하는 따뜻한 조합이에요 🌿':s>=50?'조금 다르지만, 그 차이가 매력이 될 수 있어요.':s>=30?'서로를 알아가기 위해 노력이 필요해요.':'아직은 어색하지만, 함께하면 새로운 매력을 발견할 수 있어요!'}const userScore=score(userName,selectedPlant);let bestPlant='',bestScore=-1;Object.keys(map).forEach(p=>{const s=score(userName,p);if(s>bestScore){bestScore=s;bestPlant=p}});document.getElementById('plantImage').src=`../assets/images/${(map[selectedPlant]||'INFP').toLowerCase()}.svg`;document.getElementById('mainResult').textContent=`${userName} 님과 ${selectedPlant}의 궁합은 ${userScore}점이에요!`;document.getElementById('resultMessage').textContent=message(userScore);document.getElementById('bestMatch').textContent=`${bestPlant} (${bestScore}점)`;function saveResult(){html2canvas(document.getElementById('capture-area')).then(c=>{const a=document.createElement('a');a.download=`식물궁합_${userName}_${selectedPlant}_${userScore}점.png`;a.href=c.toDataURL('image/png');a.click()})}function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareByEmail(){location.href=`mailto:?subject=${encodeURIComponent('🌿 '+userName+'님의 식물 궁합 결과')}&body=${encodeURIComponent(`${selectedPlant}와 ${userScore}점 궁합이에요!\n\n${message(userScore)}\n\n${location.href}`)}`}function goTo(f){location.href=`../${f}/index.html`}const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'};function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)
</script></main></div></body></html>
