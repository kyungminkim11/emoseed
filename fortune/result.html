<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 식물 운세 | EmoSeed</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{transition:background-color .3s,color .3s}nav{text-align:center;margin-bottom:1.5rem;line-height:1.8}nav a{margin:0 .7rem;text-decoration:none;color:inherit;font-weight:500}nav a.active{text-decoration:underline;font-weight:700}.theme-mint{background:#e6fff3;color:#2a4d3f}.theme-beige{background:#fff6e0;color:#5e4c2a}.theme-lavender{background:#f3edff;color:#453e57}.theme-pink{background:#fff0f0;color:#5a3a3a}.theme-sky{background:#e5f4ff;color:#2c5572}.theme-status{text-align:center;margin-top:3rem}.theme-link{cursor:pointer;font-weight:500;margin:0 .2rem}</style></head><body><div class="wrapper"><main class="content"><nav><div><a href="../index.html">🏠 메인</a><a href="../location.html">📍 Contact</a><a href="../event.html">🎉 Programs</a></div><div><a href="../mbti/index.html">🌱 EmoSeed Type</a><a href="../compatibility/index.html">💘 EmoSeed Match</a><a href="../name-generator/index.html">🌼 EmoSeed Name</a><a href="index.html" class="active">🔮 EmoSeed Fortune</a></div></nav><section id="capture-area" style="text-align:center;padding:2rem 1rem"><h1 id="dateTitle"></h1><h2 id="plantName" style="color:#4a774a"></h2><img id="plantImage" alt="오늘의 식물" style="max-width:300px;width:100%;border-radius:12px"><p id="fortuneMessage" style="margin-top:2rem;font-size:1.1rem;color:#555"></p></section><div style="text-align:center"><button onclick="saveResult()">📋 결과 저장하기</button><button onclick="copyLink()">🔗 링크 복사하기</button><button onclick="shareEmail()">📧 이메일로 보내기</button><button onclick="location.href='index.html'">↩️ 다시 뽑기</button></div><hr style="margin:3rem auto;width:80%;border:none;border-top:1px solid #ccc"><div style="display:flex;flex-direction:column;align-items:center"><p><b>다른 프로그램도 체험해보세요 🌿</b></p><button onclick="location.href='../index.html'">🏠 메인 페이지로 가기</button><button onclick="goTo('mbti')">🌿 EmoSeed Type</button><button onclick="goTo('compatibility')">🌿 EmoSeed Match</button><button onclick="goTo('name-generator')">🌿 EmoSeed Name</button></div><div class="theme-status" id="themeStatus"></div><div id="footer-placeholder"></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const map={무궁화:'INFP',라벤더:'INFJ',민트:'INTP',스투키:'INTJ',수국:'ISFP',선인장:'ISTP',알로에:'ISFJ',대나무:'ISTJ',해바라기:'ENFP',장미:'ENFJ',페퍼민트:'ENTP',튤립:'ENTJ',코스모스:'ESFP',장미허브:'ESTP',카네이션:'ESFJ',유칼립투스:'ESTJ'};const notes={무궁화:'묵묵히 해온 일이 결실을 맺을 거예요.',라벤더:'오늘은 조용히 숨을 고르며 마음을 정리해보세요.',민트:'새로운 시작에 어울리는 상쾌한 하루예요.',스투키:'자기만의 리듬을 지키며 단단하게 나아가세요.',수국:'당신의 섬세함이 빛나는 하루가 될 거예요.',선인장:'당신만의 속도로 걸어가도 충분히 괜찮아요.',알로에:'타인을 돌보는 마음만큼 나도 돌봐주세요.',대나무:'기본에 충실한 자세가 빛을 발할 거예요.',해바라기:'긍정적인 마음이 좋은 기회를 이끌 거예요.',장미:'솔직한 감정이 매력으로 다가오는 날이에요.',페퍼민트:'톡 쏘는 아이디어가 빛나는 하루예요.',튤립:'작지만 확실한 성취가 찾아올 거예요.',코스모스:'작은 일상 속 행복을 발견해보세요.',장미허브:'작은 변화가 큰 안정감을 줄 수 있어요.',카네이션:'감사의 말을 전하면 관계가 더 깊어져요.',유칼립투스:'공간과 마음을 정돈하면 아이디어가 떠올라요.'};const q=new URLSearchParams(location.search),plant=q.get('plant')||'라벤더',today=new Date(),message=notes[plant]||'오늘은 평온한 하루가 될 거예요.',shareUrl=`${location.origin}${location.pathname}?plant=${encodeURIComponent(plant)}`;document.getElementById('dateTitle').textContent=`📆 ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일의 식물 운세`;document.getElementById('plantName').textContent=`오늘의 식물: ${plant}`;document.getElementById('plantImage').src=`../assets/images/${(map[plant]||'INFJ').toLowerCase()}.svg`;document.getElementById('fortuneMessage').textContent=message;function saveResult(){html2canvas(document.getElementById('capture-area')).then(c=>{const a=document.createElement('a');a.download=`오늘의_식물_운세_${plant}.png`;a.href=c.toDataURL('image/png');a.click()})}function copyLink(){navigator.clipboard.writeText(shareUrl).then(()=>alert('📋 링크가 복사되었습니다!'))}function shareEmail(){location.href=`mailto:?subject=${encodeURIComponent('오늘의 식물 운세')}&body=${encodeURIComponent(message+'\n\n'+shareUrl)}`}function goTo(f){location.href=`../${f}/index.html`}const themes={mint:'🌿 민트',beige:'☕ 베이지',lavender:'💜 연보라',pink:'🍑 살구핑크',sky:'💧 하늘블루'};function applyTheme(t){document.body.className='loaded theme-'+t;localStorage.setItem('theme',t);document.getElementById('themeStatus').innerHTML=`${themes[t]} <b>테마</b>를 사용 중입니다.<br>`+Object.entries(themes).filter(([k])=>k!==t).map(([k,v])=>`<span class="theme-link" onclick="applyTheme('${k}')">${v}</span>`).join(', ')}addEventListener('load',()=>applyTheme(localStorage.getItem('theme')||'mint'));fetch('../footer.html').then(r=>r.text()).then(x=>document.getElementById('footer-placeholder').innerHTML=x)
</script></main></div></body></html>
