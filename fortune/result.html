<body data-base="../" data-page="fortune">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
  <section class="page-hero compact"><span class="eyebrow">🔮 Daily Plant Fortune</span><h1 id="dateHeading">오늘의 정원에서<br>메시지가 도착했어요</h1></section>
  <section class="result-shell">
    <article class="result-card">
      <div class="result-header">
        <div>
          <div class="result-kicker" id="fortuneDate"></div>
          <h2 class="result-title" id="plantName"></h2>
          <p class="result-subtitle" id="fortuneMessage"></p>
          <div class="keyword-list" id="fortuneKeywords"></div>
        </div>
        <img class="result-image" id="fortuneImage" alt="오늘의 식물">
      </div>
      <div class="detail-grid">
        <section class="detail-card"><h3>☀️ 오늘의 기운</h3><p id="energy"></p></section>
        <section class="detail-card"><h3>🎨 행운의 색</h3><p id="luckyColor"></p></section>
        <section class="detail-card"><h3>🫧 작은 행동</h3><p id="dailyAction"></p></section>
        <section class="detail-card"><h3>💌 관계의 힌트</h3><p id="relationHint"></p></section>
      </div>
      <div class="quote-card" id="fortuneQuote"></div>
    </article>
    <div class="share-panel"><p>오늘의 운세는 자정까지 그대로 유지돼요.</p><div class="button-row">
      <button class="primary-button" id="saveResult" type="button">📷 이미지 저장</button>
      <button class="secondary-button" id="shareResult" type="button">공유하기</button>
      <button class="secondary-button" data-copy-link type="button">링크 복사</button>
      <a class="text-button" href="index.html">오늘의 운세 다시 보기</a>
    </div></div>
    <div class="related-grid">
      <a class="related-card" href="../mbti/index.html"><strong>🌱 나와 닮은 식물</strong><span>8문항 성향 테스트</span></a>
      <a class="related-card" href="../name-generator/index.html"><strong>🌼 식물 이름</strong><span>오늘의 감정에 이름 붙이기</span></a>
      <a class="related-card" href="../compatibility/index.html"><strong>💘 식물 궁합</strong><span>마음에 드는 식물과 궁합</span></a>
    </div>
  </section>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const key = window.EmoSeed.todayKey(today);
      const seed = window.EmoSeed.hash(key);
      const plant = window.EmoSeed.dailyPlant(today);
      const score = 62 + (seed % 37);
      const colors = ['연둣빛', '따뜻한 살구색', '새벽 연보라', '맑은 하늘색', '크림 베이지', '노을 장밋빛', '깊은 숲 초록'];
      const actions = ['물 한 잔을 천천히 마시며 호흡을 고르기', '좋아하는 노래 한 곡을 처음부터 끝까지 듣기', '미뤄둔 작은 일 하나만 끝내기', '오늘 고마웠던 순간을 한 줄 적기', '10분만 천천히 걷기', '창문을 열고 바깥 공기를 느끼기', '마음에 걸린 사람에게 짧은 안부 보내기'];
      const hints = ['먼저 건넨 짧은 인사가 관계의 온도를 바꿀 수 있어요.', '설명보다 진심 어린 한 문장이 더 잘 전해지는 날이에요.', '상대의 반응을 미리 정하지 말고 천천히 들어보세요.', '고마움을 구체적으로 표현하면 마음이 가까워져요.', '혼자만의 시간도 관계를 건강하게 만드는 중요한 여백이에요.'];
      const color = colors[(seed >> 4) % colors.length];
      const action = actions[(seed >> 7) % actions.length];
      const hint = hints[(seed >> 10) % hints.length];
      const imageSrc = `../assets/images/${plant.type.toLowerCase()}.svg`;
      const dateText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
      document.getElementById('fortuneDate').textContent = dateText;
      document.getElementById('plantName').textContent = plant.name;
      document.getElementById('fortuneMessage').textContent = plant.care;
      document.getElementById('fortuneKeywords').innerHTML = [`기운 ${score}%`, color, plant.keywords[0]].map((item) => `<span class="keyword">${item}</span>`).join('');
      document.getElementById('energy').textContent = score >= 88 ? '새로운 일을 시작하기 좋은 맑고 힘찬 기운이에요.' : score >= 75 ? '무리하지 않아도 작은 성취가 차곡차곡 쌓이는 기운이에요.' : '속도를 줄이고 내 리듬을 돌보면 더 편안해지는 기운이에요.';
      document.getElementById('luckyColor').textContent = `${color}을 옷이나 소품, 화면 배경에 살짝 더해보세요.`;
      document.getElementById('dailyAction').textContent = action;
      document.getElementById('relationHint').textContent = hint;
      document.getElementById('fortuneQuote').textContent = `“${plant.quote}”`;
      const image = document.getElementById('fortuneImage'); image.src = imageSrc; image.alt = `${plant.name} 일러스트`;
      document.getElementById('saveResult').addEventListener('click', () => window.EmoSeedApp.downloadResultImage({
        kicker: dateText, title: `오늘의 식물 · ${plant.name}`, subtitle: plant.care,
        keywords: [`기운 ${score}%`, color, plant.keywords[0]], message: `오늘의 작은 행동: ${action}`, quote: plant.quote, imageSrc,
        filename: `EmoSeed_오늘의운세_${key}_${plant.name}.png`
      }));
      document.getElementById('shareResult').addEventListener('click', () => window.EmoSeedApp.shareResultImage({
        kicker: dateText, title: `오늘의 식물 · ${plant.name}`, subtitle: plant.care,
        keywords: [`기운 ${score}%`, color, plant.keywords[0]], message: `오늘의 작은 행동: ${action}`, quote: plant.quote, imageSrc,
        filename: `EmoSeed_오늘의운세_${key}_${plant.name}.png`
      }, { title: `${dateText} 오늘의 식물은 ${plant.name}`, text: `${plant.care}
${plant.quote}`, url: location.href }));
      window.EmoSeedApp.track('result_view', { test: 'fortune', result: plant.name, date: key });
    });
  </script>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
