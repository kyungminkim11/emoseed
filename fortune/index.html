<body data-base="../" data-page="fortune">
  <div id="site-header"></div>
  <main id="main-content" class="page-shell">
<section class="page-hero">
  <span class="eyebrow">🔮 EmoSeed Fortune</span>
  <h1>오늘의 마음에는<br>어떤 식물이 피어날까요?</h1>
  <p>하루에 하나의 식물이 당신을 기다립니다. 같은 날에는 같은 결과가 유지되고, 다음 날 자정에 새로운 운세가 피어나요.</p>
</section>
<section class="narrow content-card" style="text-align:center">
  <div style="width:min(100%,320px);margin:0 auto 24px;border-radius:28px;overflow:hidden;background:var(--surface-soft)"><img id="previewImage" src="../assets/images/infj.svg" alt="오늘의 식물 미리보기" style="aspect-ratio:4/5;object-fit:cover;filter:blur(14px) saturate(.6);transform:scale(1.08)"></div>
  <h2 id="fortuneDate">오늘의 운세가 준비됐어요</h2>
  <p style="color:var(--muted)">오늘의 식물, 마음의 온도, 행운의 색과 작은 행동을 확인해보세요.</p>
  <div class="button-row" style="justify-content:center"><a class="primary-button" href="result.html">🔮 오늘의 운세 열기</a></div>
  <p id="nextFortune" style="margin-top:18px;color:var(--muted);font-size:13px"></p>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('fortuneDate').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일의 운세가 준비됐어요`;
    function updateCountdown() {
      const current = new Date();
      const next = new Date(current); next.setHours(24, 0, 0, 0);
      const diff = next - current;
      const hours = Math.floor(diff / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      document.getElementById('nextFortune').textContent = `새 운세까지 ${hours}시간 ${minutes}분`;
    }
    updateCountdown(); setInterval(updateCountdown, 60000);
  });
</script>
